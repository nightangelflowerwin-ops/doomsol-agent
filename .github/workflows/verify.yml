name: Verify DoomSol Agent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused perception tests
        run: python -m unittest discover -s tests -v

      - name: Confirm public project records exist
        run: test -s README.md && test -s WORKLOG.md
